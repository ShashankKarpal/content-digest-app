<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Content Digest Capture</title>
<style>
  body { width: 350px; margin: 0; padding: 16px; font: 13px -apple-system, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }
  h1 { margin: 0 0 5px; color: #b17e51; font-size: 18px; }
  .hint { margin: 0 0 12px; color: #94a3b8; line-height: 1.4; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #444; border-radius: 7px; background: #111827; color: #fff; }
  .buttons { display: flex; gap: 8px; margin-top: 9px; }
  button { width: 100%; border: 0; border-radius: 7px; padding: 10px 11px; background: #b17e51; color: #111; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  #result { min-height: 20px; margin: 12px 0; color: #d1d5db; line-height: 1.4; }
  .links { display: flex; flex-wrap: wrap; gap: 7px 13px; margin: 10px 0; }
  .text-button { width: auto; padding: 0; background: transparent; color: #c99a6d; font-weight: 500; }
  details { color: #94a3b8; font-size: 11px; }
  ol { padding-left: 20px; margin: 7px 0; max-height: 125px; overflow: auto; }
  li { margin: 6px 0; overflow-wrap: anywhere; }
  a { color: #c99a6d; }
</style>
</head>
<body>
<h1>Content Digest</h1>
<p class="hint">Paste the exact URL you want Content Digest to read and summarize.</p>
<form id="capture-form">
  <input id="url" type="url" aria-label="URL to save" placeholder="https://..." autofocus>
  <div class="buttons"><button id="save-url" type="submit">Send to Content Digest</button></div>
</form>
<div id="result" role="status"></div>
<div class="links">
  <button id="save-page" class="text-button" type="button">Save current page</button>
  <button id="open-digest" class="text-button" type="button">Open Content Digest</button>
  <button id="options" class="text-button" type="button">Settings</button>
</div>
<details>
  <summary id="meta">Recent activity</summary>
  <ol id="history"></ol>
</details>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
