<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Content Digest Capture Settings</title>
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; max-width: 520px; margin: 40px auto; padding: 0 20px; }
  h1 { color: #b17e51; font-size: 20px; }
  label { display: block; margin: 18px 0 6px; color: #aaa; }
  input { width: 100%; box-sizing: border-box; background: #1e1e1e; border: 1px solid #333; color: #e0e0e0; padding: 9px 12px; border-radius: 8px; }
  input:focus { border-color: #b17e51; }
  button { margin: 20px 8px 0 0; background: #b17e51; border: 0; color: #000; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  button.secondary { background: #475569; color: #fff; }
  #status { display: block; min-height: 20px; margin-top: 14px; }
  .hint { font-size: 11px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
<h1>Content Digest Capture</h1>
<label for="server">Server URL</label>
<input type="url" id="server" placeholder="http://localhost:7778">
<div class="hint">Leave empty until you deliberately configure the server. Include the port.</div>
<label for="token">Auth token</label>
<input type="password" id="token" placeholder="Bearer token from secrets.json">
<div class="hint">Stored only in this Chrome profile, never in Chrome sync.</div>
<button id="save">Save</button><button id="test" class="secondary">Test connection</button>
<span id="status" role="status"></span>
<script src="options.js"></script>
</body>
</html>
